<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오맵 장소 검색</title>
  <style>
    /* 기본 설정 */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      color: #222;
    }
    /* 왼쪽 검색창과 오른쪽 지도를 가로로 배치 */
    .container {
      display: flex;
      width: 100%;
      height: 100vh;
    }
    /* 왼쪽 검색 영역 */
    .sidebar {
      width: 360px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ddd;
      background: white;
    }
    .header { padding: 24px 18px 16px; }
    h1 { margin: 0 0 18px; font-size: 23px; }
    /* 검색창과 버튼 */
    .search-form { display: flex; gap: 8px; }
    #searchInput {
      width: 0;
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
    }
    #searchButton {
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      background: #fee500;
      color: #222;
      font-weight: bold;
      cursor: pointer;
    }
    #searchButton:disabled { cursor: wait; opacity: 0.6; }
    /* 안내 메시지 */
    #status {
      padding: 0 18px 12px;
      color: #666;
      font-size: 13px;
      line-height: 1.5;
    }
    /* 검색 결과 목록 */
    #resultList { flex: 1; overflow-y: auto; border-top: 1px solid #eee; }
    .place-item {
      padding: 15px 18px;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .place-item:hover { background: #fffbea; }
    .place-item h2 { margin: 0 0 8px; font-size: 16px; }
    .place-item p {
      margin: 5px 0;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }
    .place-item a {
      display: inline-block;
      margin-top: 8px;
      color: #1769aa;
      font-size: 12px;
    }
    /* 오른쪽 지도 영역 */
    #map { flex: 1; min-width: 0; height: 100%; background: #eee; }
    /* 모바일 화면 대응 */
    @media (max-width: 600px) {
      .sidebar { width: 45%; }
      .header { padding: 15px 10px; }
      h1 { font-size: 18px; }
      #searchInput, #searchButton { padding: 10px 6px; font-size: 12px; }
      #status { padding: 0 10px 10px; }
      .place-item { padding: 12px 10px; }
      .place-item h2 { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 왼쪽: 검색창과 결과 목록 -->
    <aside class="sidebar">
      <div class="header">
        <h1>📍 장소 검색</h1>
        <form id="searchForm" class="search-form">
          <input id="searchInput" type="text" placeholder="장소를 검색하세요" aria-label="장소 검색">
          <button id="searchButton" type="submit" disabled>검색</button>
        </form>
      </div>
      <div id="status" role="status" aria-live="polite">지도를 불러오는 중입니다.</div>
      <div id="resultList"></div>
    </aside>
    <!-- 오른쪽: 지도 -->
    <main id="map" aria-label="카카오맵"></main>
  </div>

  <!-- 카카오 지도 SDK와 장소 검색 라이브러리 -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=88da391c092d9ea0fdff3752a51622e0&libraries=services&autoload=false"
    onerror="document.getElementById('status').textContent='지도 SDK 로딩에 실패했습니다. API 키와 사이트 도메인을 확인해 주세요.'"
  ></script>

  <script>
    // HTML 요소 가져오기
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const statusText = document.getElementById("status");
    const resultList = document.getElementById("resultList");

    // 지도와 검색에 사용할 변수
    let map = null;
    let places = null;
    let currentLocationMarker = null;
    let selectedMarker = null;
    let resultMarkers = [];
    let mapReady = false;

    // 기본 지도 위치: 서울 시청
    const defaultLatitude = 37.5665;
    const defaultLongitude = 126.9780;

    // 지도를 생성하는 함수
    function initializeMap() {
      const mapContainer = document.getElementById("map");

      // 지도 중심 좌표와 확대 레벨 설정
      const mapOptions = {
        center: new kakao.maps.LatLng(defaultLatitude, defaultLongitude),
        level: 5
      };

      // 지도 생성
      map = new kakao.maps.Map(mapContainer, mapOptions);

      // 장소 검색 서비스 생성
      places = new kakao.maps.services.Places(map);

      // 지도가 표시된 후 초기화 완료 처리
      kakao.maps.event.addListenerOnce(map, "idle", function () {
        mapReady = true;
        searchButton.disabled = false;
        statusText.textContent = "현재 위치를 확인하고 있습니다.";

        // 지도 준비가 끝나면 현재 위치 요청
        getCurrentLocation();
      });
    }

    // 현재 위치를 확인하는 함수
    function getCurrentLocation() {
      // 브라우저가 위치 정보를 지원하는지 확인
      if (!navigator.geolocation) {
        statusText.textContent =
          "위치 기능을 지원하지 않습니다. 서울 시청을 중심으로 검색합니다.";
        return;
      }

      // 브라우저에 위치 권한 요청
      navigator.geolocation.getCurrentPosition(
        function (position) {
          // 현재 위치의 위도와 경도 가져오기
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          const currentPosition = new kakao.maps.LatLng(latitude, longitude);

          // 지도 중심을 현재 위치로 이동
          map.setCenter(currentPosition);

          // 현재 위치 마커 표시
          currentLocationMarker = new kakao.maps.Marker({
            map: map,
            position: currentPosition
          });

          statusText.textContent =
            "현재 위치를 표시했습니다. 장소를 검색해 보세요.";
        },
        function (error) {
          // 위치 확인 실패 원인에 따라 안내
          if (error.code === 1) {
            statusText.textContent =
              "위치 권한이 거부되었습니다. 기본 위치에서 검색할 수 있습니다.";
          } else if (error.code === 2) {
            statusText.textContent =
              "현재 위치를 확인할 수 없습니다. 기본 위치에서 검색합니다.";
          } else {
            statusText.textContent =
              "위치 확인 시간이 초과되었습니다. 기본 위치에서 검색합니다.";
          }
        },
        {
          enableHighAccuracy: false,
          timeout: 10000,
          maximumAge: 60000
        }
      );
    }

    // 이전 검색 결과 마커 제거
    function clearResultMarkers() {
      resultMarkers.forEach(function (marker) {
        marker.setMap(null);
      });
      resultMarkers = [];
    }

    // 검색 결과를 목록과 지도에 표시
    function displayResults(results) {
      resultList.replaceChildren();
      clearResultMarkers();

      if (results.length === 0) {
        statusText.textContent = "검색 결과가 없습니다.";
        return;
      }

      statusText.textContent = "검색 결과 " + results.length + "개를 찾았습니다.";

      // 검색 결과를 하나씩 화면에 추가
      results.forEach(function (place) {
        const item = document.createElement("article");
        item.className = "place-item";

        const title = document.createElement("h2");
        title.textContent = place.place_name;

        const category = document.createElement("p");
        category.textContent = place.category_name || "분류 정보 없음";

        const address = document.createElement("p");
        address.textContent =
          place.road_address_name || place.address_name || "주소 정보 없음";

        item.append(title, category, address);

        // 카카오맵 상세 페이지 링크 추가
        if (place.place_url) {
          const link = document.createElement("a");
          link.textContent = "카카오맵에서 자세히 보기";
          link.href = place.place_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          item.appendChild(link);
        }

        // 결과 항목을 클릭하면 지도 중심 이동
        item.addEventListener("click", function () {
          const position = new kakao.maps.LatLng(Number(place.y), Number(place.x));
          map.panTo(position);

          // 이전에 선택한 장소 마커 제거
          if (selectedMarker) selectedMarker.setMap(null);

          // 선택한 장소에 새 마커 표시
          selectedMarker = new kakao.maps.Marker({
            map: map,
            position: position
          });

          map.setLevel(5);
        });

        resultList.appendChild(item);

        // 검색 결과의 위치에 지도 마커 추가
        const marker = new kakao.maps.Marker({
          map: map,
          position: new kakao.maps.LatLng(Number(place.y), Number(place.x))
        });
        resultMarkers.push(marker);
      });
    }

    // 검색어를 받아 장소를 검색
    function searchPlaces(keyword) {
      if (!mapReady || !places) {
        statusText.textContent = "지도가 아직 준비되지 않았습니다.";
        return;
      }

      const searchKeyword = keyword.trim();

      // 검색어가 비어 있는지 확인
      if (!searchKeyword) {
        statusText.textContent = "검색할 장소 이름을 입력해 주세요.";
        searchInput.focus();
        return;
      }

      searchButton.disabled = true;
      statusText.textContent = "장소를 검색하고 있습니다.";
      resultList.replaceChildren();
      clearResultMarkers();

      // 카카오맵 키워드 검색 실행
      places.keywordSearch(
        searchKeyword,
        function (results, status) {
          searchButton.disabled = false;

          if (status === kakao.maps.services.Status.OK) {
            displayResults(results);
          } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            statusText.textContent =
              "검색 결과가 없습니다. 다른 검색어를 입력해 보세요.";
          } else {
            statusText.textContent =
              "검색 오류가 발생했습니다. API 설정과 연결 상태를 확인해 주세요.";
          }
        },
        {
          location: map.getCenter(),
          sort: kakao.maps.services.SortBy.DISTANCE,
          size: 15
        }
      );
    }

    // 검색 버튼이나 Enter 키로 검색
    searchForm.addEventListener("submit", function (event) {
      event.preventDefault();
      searchPlaces(searchInput.value);
    });

    // SDK가 준비된 뒤에만 지도 초기화 코드를 실행
    if (window.kakao && window.kakao.maps) {
      kakao.maps.load(function () {
        initializeMap();
      });
    } else {
      statusText.textContent =
        "카카오맵 SDK를 불러오지 못했습니다. 인터넷 연결과 API 설정을 확인해 주세요.";
    }
  </script>
</body>
</html>
