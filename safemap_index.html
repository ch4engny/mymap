<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세이프맵 - 편의점·경찰서 찾기</title>
  <style>
    /* 기본 화면 설정 */
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { font-family: Arial, "Malgun Gothic", sans-serif; color: #222; }
    .container { display: flex; width: 100%; height: 100vh; overflow: hidden; }

    /* 왼쪽 장소 목록 영역 */
    .sidebar {
      display: flex; flex-direction: column; width: 360px; min-width: 280px;
      flex-shrink: 0; background: #fff; border-right: 1px solid #ddd;
    }
    .header { padding: 22px 18px 14px; }
    h1 { margin: 0 0 8px; font-size: 23px; }
    .subtitle { margin: 0 0 16px; color: #666; font-size: 13px; line-height: 1.5; }
    .tab-list { display: flex; gap: 8px; margin-bottom: 2px; }
    .tab-button {
      flex: 1; padding: 11px 8px; border: 1px solid #ddd; border-radius: 9px;
      background: #f7f7f7; color: #333; font-size: 14px; font-weight: bold; cursor: pointer;
    }
    .tab-button.active[data-category="convenience"] { border-color: #159447; background: #159447; color: #fff; }
    .tab-button.active[data-category="police"] { border-color: #2468d9; background: #2468d9; color: #fff; }
    .tab-button:disabled { opacity: .55; cursor: wait; }
    #status { padding: 0 18px 12px; color: #666; font-size: 13px; line-height: 1.5; }
    #resultList { flex: 1; min-height: 0; overflow-y: auto; border-top: 1px solid #eee; }
    .place-item { padding: 14px 18px; border-bottom: 1px solid #eee; cursor: pointer; }
    .place-item:hover, .place-item:focus { background: #f5f8ff; outline: none; }
    .place-heading { display: flex; align-items: flex-start; gap: 9px; }
    .place-dot { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%; color: #fff; font-size: 14px; font-weight: bold; }
    .place-dot.convenience { background: #159447; }
    .place-dot.police { background: #2468d9; }
    .place-name { margin: 2px 0 7px; font-size: 15px; line-height: 1.4; }
    .place-address { margin: 0 0 7px; color: #666; font-size: 12px; line-height: 1.5; }
    .place-link { color: #1769aa; font-size: 12px; text-decoration: none; }
    .place-link:hover { text-decoration: underline; }

    /* 오른쪽 지도 영역 */
    #map { flex: 1; min-width: 0; height: 100%; background: #eee; }
    .info-window { min-width: 170px; max-width: 240px; padding: 8px 10px; font-family: Arial, "Malgun Gothic", sans-serif; line-height: 1.5; }
    .info-title { margin-bottom: 4px; font-size: 14px; font-weight: bold; }
    .info-address { color: #555; font-size: 12px; overflow-wrap: anywhere; }

    /* 휴대전화 화면 대응 */
    @media (max-width: 600px) {
      .sidebar { width: 46%; min-width: 0; }
      .header { padding: 15px 10px 12px; }
      h1 { font-size: 18px; }
      .subtitle { font-size: 11px; }
      .tab-list { gap: 5px; }
      .tab-button { padding: 10px 4px; font-size: 12px; }
      #status { padding: 0 10px 10px; font-size: 11px; }
      .place-item { padding: 11px 9px; }
      .place-name { font-size: 13px; }
      .place-address { font-size: 11px; }
      .place-dot { width: 24px; height: 24px; flex-basis: 24px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 왼쪽: 두 탭과 검색 결과 목록 -->
    <aside class="sidebar">
      <div class="header">
        <h1>🛟 세이프맵</h1>
        <p class="subtitle">현재 위치에서 가까운 편의점과 경찰서를 찾아보세요.</p>
        <div class="tab-list" role="tablist" aria-label="장소 종류 선택">
          <button class="tab-button active" type="button" role="tab" aria-selected="true" data-category="convenience">🏪 편의점</button>
          <button class="tab-button" type="button" role="tab" aria-selected="false" data-category="police">🚓 경찰서</button>
        </div>
      </div>
      <div id="status" role="status" aria-live="polite">지도를 불러오는 중입니다.</div>
      <div id="resultList"></div>
    </aside>
    <!-- 오른쪽: 카카오맵 -->
    <main id="map" aria-label="세이프맵 지도"></main>
  </div>

  <!-- 카카오맵 SDK: services 라이브러리를 포함해 불러오기 -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=88da391c092d9ea0fdff3752a51622e0&libraries=services&autoload=false"
    onerror="window.kakaoMapSdkFailed=true; document.getElementById('status').textContent='카카오맵 SDK 로딩에 실패했습니다. API 키와 웹 도메인 설정을 확인해 주세요.';"></script>
  <script>
    /* 화면 요소 */
    const statusText = document.getElementById("status");
    const resultList = document.getElementById("resultList");
    const tabButtons = document.querySelectorAll(".tab-button");

    /* 지도와 검색에 사용할 변수 */
    let map = null;
    let places = null;
    let currentLocation = null;
    let currentLocationMarker = null;
    let placeMarkers = [];
    let infoWindow = null;
    let mapReady = false;
    let activeCategory = "convenience";
    let searchRequestId = 0;

    /* 기본 위치는 서울시청이며, 위치 확인에 실패하면 이곳을 사용 */
    const defaultLocation = { lat: 37.5665, lng: 126.9780 };

    /* 마커 아이콘을 SVG 이미지로 만들기 */
    function createMarkerImage(color, label) {
      const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="42" height="50" viewBox="0 0 42 50">' +
        '<path d="M21 1C10 1 2 9 2 20c0 14 19 28 19 28S40 34 40 20C40 9 32 1 21 1z" fill="' + color + '" stroke="#fff" stroke-width="2"/>' +
        '<circle cx="21" cy="20" r="12" fill="#fff"/><text x="21" y="25" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial,sans-serif" fill="' + color + '">' + label + '</text></svg>';
      const imageUrl = "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
      return new kakao.maps.MarkerImage(imageUrl, new kakao.maps.Size(42, 50), { offset: new kakao.maps.Point(21, 49) });
    }

    function getPlaceAddress(place) {
      return place.road_address_name || place.address_name || "주소 정보 없음";
    }

    /* 지도 생성 */
    function initializeMap() {
      const startPosition = new kakao.maps.LatLng(defaultLocation.lat, defaultLocation.lng);
      map = new kakao.maps.Map(document.getElementById("map"), { center: startPosition, level: 5 });
      places = new kakao.maps.services.Places(map);
      infoWindow = new kakao.maps.InfoWindow({ zIndex: 10 });
      currentLocation = startPosition;

      /* 지도 표시가 끝나면 기본 위치로 우선 검색하고, 현재 위치도 요청 */
      kakao.maps.event.addListenerOnce(map, "idle", function () {
        mapReady = true;
        statusText.textContent = "주변 장소를 검색하고 있습니다. 현재 위치 권한을 허용하면 더 정확해요.";
        searchNearbyPlaces();
        getCurrentLocation();
      });
    }

    /* 브라우저에서 현재 위치 가져오기 */
    function getCurrentLocation() {
      if (!navigator.geolocation) {
        statusText.textContent = "이 브라우저에서는 위치 기능을 사용할 수 없어 서울시청 주변을 검색합니다.";
        return;
      }
      navigator.geolocation.getCurrentPosition(function (position) {
        currentLocation = new kakao.maps.LatLng(position.coords.latitude, position.coords.longitude);
        map.setCenter(currentLocation);
        if (currentLocationMarker) currentLocationMarker.setMap(null);
        currentLocationMarker = new kakao.maps.Marker({
          map: map,
          position: currentLocation,
          image: createMarkerImage("#2468d9", "나"),
          title: "현재 위치",
          zIndex: 5
        });
        searchNearbyPlaces();
      }, function (error) {
        /* 권한 거부 또는 위치 확인 실패 시 기본 위치 검색 결과를 유지 */
        if (error.code === 1) {
          statusText.textContent = "위치 권한이 거부되어 서울시청 주변 결과를 표시합니다.";
        } else if (error.code === 2) {
          statusText.textContent = "현재 위치를 확인하지 못해 서울시청 주변 결과를 표시합니다.";
        } else {
          statusText.textContent = "위치 확인 시간이 초과되어 서울시청 주변 결과를 표시합니다.";
        }
      }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 });
    }

    /* 기존 장소 마커와 팝업 정리 */
    function clearPlaceMarkers() {
      placeMarkers.forEach(function (marker) { marker.setMap(null); });
      placeMarkers = [];
      if (infoWindow) infoWindow.close();
    }
    function clearPlaces() {
      resultList.replaceChildren();
      clearPlaceMarkers();
    }

    /* 장소 이름과 주소를 지도 팝업에 표시 */
    function showPlaceInfo(place, marker) {
      const content = document.createElement("div");
      content.className = "info-window";
      const title = document.createElement("div");
      title.className = "info-title";
      title.textContent = place.place_name;
      const address = document.createElement("div");
      address.className = "info-address";
      address.textContent = getPlaceAddress(place);
      content.append(title, address);
      infoWindow.setContent(content);
      infoWindow.open(map, marker);
    }

    /* 두 좌표 사이의 직선거리를 미터로 계산 */
    function getDistanceMeters(pointA, pointB) {
      const earthRadius = 6371000;
      const lat1 = pointA.getLat() * Math.PI / 180;
      const lat2 = pointB.getLat() * Math.PI / 180;
      const deltaLat = (pointB.getLat() - pointA.getLat()) * Math.PI / 180;
      const deltaLng = (pointB.getLng() - pointA.getLng()) * Math.PI / 180;
      const a = Math.sin(deltaLat / 2) * Math.sin(deltaLat / 2) +
        Math.cos(lat1) * Math.cos(lat2) * Math.sin(deltaLng / 2) * Math.sin(deltaLng / 2);
      return earthRadius * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    /* 검색 결과를 왼쪽 목록과 지도에 표시 */
    function displayPlaces(results, category, requestId) {
      if (requestId !== searchRequestId) return;
      clearPlaces();
      if (!results || results.length === 0) {
        statusText.textContent = "주변 2km 안에서 검색 결과를 찾지 못했습니다.";
        return;
      }
      statusText.textContent = (category === "convenience" ? "편의점 " : "경찰서 ") + results.length + "곳을 찾았습니다.";

      results.forEach(function (place) {
        const position = new kakao.maps.LatLng(Number(place.y), Number(place.x));
        const markerColor = category === "convenience" ? "#159447" : "#2468d9";
        const markerLabel = category === "convenience" ? "C" : "P";
        const marker = new kakao.maps.Marker({
          map: map,
          position: position,
          image: createMarkerImage(markerColor, markerLabel),
          title: place.place_name
        });
        placeMarkers.push(marker);
        kakao.maps.event.addListener(marker, "click", function () { showPlaceInfo(place, marker); });

        const item = document.createElement("article");
        item.className = "place-item";
        item.tabIndex = 0;
        const heading = document.createElement("div");
        heading.className = "place-heading";
        const dot = document.createElement("span");
        dot.className = "place-dot " + category;
        dot.textContent = markerLabel;
        dot.setAttribute("aria-hidden", "true");
        const details = document.createElement("div");
        details.style.minWidth = "0";
        const name = document.createElement("h2");
        name.className = "place-name";
        name.textContent = place.place_name;
        const address = document.createElement("p");
        address.className = "place-address";
        address.textContent = getPlaceAddress(place);
        details.append(name, address);
        heading.append(dot, details);
        item.appendChild(heading);

        if (place.place_url) {
          const link = document.createElement("a");
          link.className = "place-link";
          link.href = place.place_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "카카오맵에서 자세히 보기";
          link.addEventListener("click", function (event) { event.stopPropagation(); });
          item.appendChild(link);
        }
        function selectPlace() {
          map.panTo(position);
          showPlaceInfo(place, marker);
        }
        item.addEventListener("click", selectPlace);
        item.addEventListener("keydown", function (event) {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); selectPlace(); }
        });
        resultList.appendChild(item);
      });
    }

    /* 현재 탭의 종류에 맞게 주변 장소 검색 */
    function searchNearbyPlaces() {
      if (!mapReady || !places || !currentLocation) return;
      const requestId = ++searchRequestId;
      clearPlaces();
      const categoryName = activeCategory === "convenience" ? "편의점" : "경찰서";
      statusText.textContent = "주변 " + categoryName + "을(를) 검색하고 있습니다.";
      console.log("[세이프맵] 검색 시작:", categoryName, currentLocation.getLat(), currentLocation.getLng());

      if (activeCategory === "convenience") {
        /* CS2는 카카오 장소 검색의 편의점 카테고리 코드 */
        places.categorySearch("CS2", function (results, status) {
          if (requestId !== searchRequestId) return;
          console.log("[세이프맵] 편의점 검색 상태:", status, results);
          if (status === kakao.maps.services.Status.OK) {
            displayPlaces(results, "convenience", requestId);
          } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            statusText.textContent = "주변 2km 안에 편의점 검색 결과가 없습니다.";
          } else {
            statusText.textContent = "편의점 검색에 실패했습니다. F12의 Console 오류를 확인해 주세요. (상태: " + status + ")";
          }
        }, { location: currentLocation, radius: 2000, sort: kakao.maps.services.SortBy.DISTANCE });
      } else {
        /* 경찰서는 키워드로 검색한 다음 2km 이내 결과만 표시 */
        places.keywordSearch("경찰서", function (results, status) {
          if (requestId !== searchRequestId) return;
          console.log("[세이프맵] 경찰서 검색 상태:", status, results);
          if (status === kakao.maps.services.Status.OK) {
            const nearbyResults = results.filter(function (place) {
              const position = new kakao.maps.LatLng(Number(place.y), Number(place.x));
              return getDistanceMeters(currentLocation, position) <= 2000;
            });
            displayPlaces(nearbyResults, "police", requestId);
          } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            statusText.textContent = "주변에서 경찰서 검색 결과를 찾지 못했습니다. 지구대나 파출소는 검색어에 포함되지 않을 수 있어요.";
          } else {
            statusText.textContent = "경찰서 검색에 실패했습니다. F12의 Console 오류를 확인해 주세요. (상태: " + status + ")";
          }
        }, { location: currentLocation, radius: 2000, sort: kakao.maps.services.SortBy.DISTANCE });
      }
    }

    /* 탭을 바꾸면 이전 결과를 지우고 선택한 종류를 검색 */
    tabButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        if (!mapReady) return;
        activeCategory = button.dataset.category;
        tabButtons.forEach(function (tab) {
          const isActive = tab === button;
          tab.classList.toggle("active", isActive);
          tab.setAttribute("aria-selected", String(isActive));
        });
        searchNearbyPlaces();
      });
    });

    /* SDK 준비 상태를 확인한 뒤 지도를 시작 */
    window.addEventListener("load", function () {
      if (window.kakao && window.kakao.maps && typeof kakao.maps.load === "function") {
        kakao.maps.load(function () {
          try {
            if (!kakao.maps.services || !kakao.maps.services.Places) {
              statusText.textContent = "장소 검색 서비스를 불러오지 못했습니다. SDK 주소에 libraries=services가 있는지 확인해 주세요.";
              console.error("[세이프맵] 장소 검색 서비스가 없습니다.");
              return;
            }
            initializeMap();
          } catch (error) {
            statusText.textContent = "지도를 시작하는 중 오류가 발생했습니다. F12의 Console을 확인해 주세요.";
            console.error("[세이프맵] 지도 초기화 오류:", error);
          }
        });
      } else {
        statusText.textContent = "카카오맵 SDK를 불러오지 못했습니다. API 키와 웹 도메인 설정을 확인해 주세요.";
        console.error("[세이프맵] SDK를 사용할 수 없습니다. 키와 도메인 설정을 확인하세요.");
      }
    });
  </script>
</body>
</html>
