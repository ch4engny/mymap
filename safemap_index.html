<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>세이프맵 - 편의점·경찰서 찾기</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;font-family:Arial,"Malgun Gothic",sans-serif;color:#222}
.container{display:flex;width:100%;height:100vh;overflow:hidden}
.sidebar{display:flex;flex-direction:column;width:360px;min-width:300px;flex-shrink:0;background:#fff;border-right:1px solid #ddd}
.header{padding:22px 18px 14px}h1{margin:0 0 8px;font-size:23px}.subtitle{margin:0 0 16px;color:#666;font-size:13px}
.tab-list{display:flex;gap:8px;margin-bottom:14px}
.tab-button{flex:1;padding:11px 8px;border:1px solid #ddd;border-radius:9px;background:#f7f7f7;color:#333;font-size:14px;font-weight:bold;cursor:pointer}
.tab-button.active[data-category="convenience"]{border-color:#159447;background:#159447;color:white}
.tab-button.active[data-category="police"]{border-color:#2468d9;background:#2468d9;color:white}
.tab-button:disabled{opacity:.55;cursor:wait}
#status{padding:0 18px 12px;color:#666;font-size:13px;line-height:1.5}
#resultList{flex:1;overflow-y:auto;border-top:1px solid #eee}
.place-item{padding:14px 18px;border-bottom:1px solid #eee;cursor:pointer}.place-item:hover,.place-item:focus{background:#f5f8ff;outline:none}
.place-heading{display:flex;align-items:flex-start;gap:9px}.place-dot{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:0 0 28px;border-radius:50%;color:#fff;font-size:14px;font-weight:bold}
.place-dot.convenience{background:#159447}.place-dot.police{background:#2468d9}
.place-name{margin:2px 0 7px;font-size:15px;line-height:1.4}.place-address{margin:0 0 7px;color:#666;font-size:12px;line-height:1.5}
.place-link{color:#1769aa;font-size:12px;text-decoration:none}.place-link:hover{text-decoration:underline}
#map{flex:1;min-width:0;height:100%;background:#eee}
.info-window{min-width:170px;max-width:240px;padding:9px 12px;font-family:Arial,"Malgun Gothic",sans-serif;line-height:1.5}
.info-title{margin-bottom:4px;font-size:14px;font-weight:bold}.info-address{color:#555;font-size:12px;overflow-wrap:anywhere}
@media(max-width:600px){.sidebar{width:46%;min-width:0}.header{padding:15px 10px 12px}h1{font-size:18px}.subtitle{font-size:11px}.tab-list{gap:5px}.tab-button{padding:10px 4px;font-size:12px}#status{padding:0 10px 10px;font-size:11px}.place-item{padding:11px 9px}.place-name{font-size:13px}.place-address{font-size:11px}.place-dot{width:24px;height:24px;flex-basis:24px}}
</style>
</head>
<body>
<div class="container">
  <!-- 왼쪽: 탭과 장소 목록 -->
  <aside class="sidebar">
    <div class="header">
      <h1>🛟 세이프맵</h1>
      <p class="subtitle">현재 위치 주변의 편의점과 경찰서를 찾아보세요.</p>
      <!-- 탭을 누르면 해당 종류의 장소를 검색 -->
      <div class="tab-list" role="tablist" aria-label="장소 종류 선택">
        <button class="tab-button active" type="button" role="tab" aria-selected="true" data-category="convenience">🏪 편의점</button>
        <button class="tab-button" type="button" role="tab" aria-selected="false" data-category="police">🚓 경찰서</button>
      </div>
    </div>
    <div id="status" role="status" aria-live="polite">지도를 불러오는 중입니다.</div>
    <div id="resultList"></div>
  </aside>
  <!-- 오른쪽: 카카오 지도 -->
  <main id="map" aria-label="세이프맵 지도"></main>
</div>

<!-- 카카오 지도 SDK와 장소 검색 서비스 불러오기 -->
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=88da391c092d9ea0fdff3752a51622e0&libraries=services&autoload=false"
 onerror="document.getElementById('status').textContent='지도 SDK를 불러오지 못했습니다. API 키와 웹 도메인 설정을 확인해 주세요.'"></script>
<script>
/* HTML 요소 가져오기 */
const statusText=document.getElementById("status");
const resultList=document.getElementById("resultList");
const tabButtons=document.querySelectorAll(".tab-button");

/* 지도와 장소 검색에 사용할 변수 */
let map=null,places=null,currentLocation=null,currentLocationMarker=null;
let placeMarkers=[],infoWindow=null,mapReady=false,activeCategory="convenience",searchRequestId=0;

/* 기본 지도 위치: 서울 시청 */
const defaultLatitude=37.5665,defaultLongitude=126.9780;

/* 카테고리별 SVG 마커 이미지 만들기 */
function createSvgMarker(color,label){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="42" height="50" viewBox="0 0 42 50">
  <path d="M21 1C10 1 2 9 2 20c0 14 19 28 19 28S40 34 40 20C40 9 32 1 21 1z" fill="${color}" stroke="#fff" stroke-width="2"/>
  <circle cx="21" cy="20" r="12" fill="#fff"/><text x="21" y="25" text-anchor="middle" font-size="14" font-weight="bold" font-family="Arial,sans-serif" fill="${color}">${label}</text></svg>`;
  const imageUrl="data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg);
  return new kakao.maps.MarkerImage(imageUrl,new kakao.maps.Size(42,50),{offset:new kakao.maps.Point(21,49)});
}
function getPlaceMarkerImage(category){
  return category==="convenience"?createSvgMarker("#159447","C"):createSvgMarker("#2468d9","P");
}

/* 지도 초기화 */
function initializeMap(){
  const mapContainer=document.getElementById("map");
  map=new kakao.maps.Map(mapContainer,{
    center:new kakao.maps.LatLng(defaultLatitude,defaultLongitude),level:5
  });
  places=new kakao.maps.services.Places(map);
  infoWindow=new kakao.maps.InfoWindow({zIndex:10});
  /* 지도가 표시된 뒤 현재 위치 확인 */
  kakao.maps.event.addListenerOnce(map,"idle",function(){
    mapReady=true;
    statusText.textContent="현재 위치를 확인하고 있습니다.";
    getCurrentLocation();
  });
}

/* 현재 위치를 지도에 표시 */
function getCurrentLocation(){
  if(!navigator.geolocation){
    statusText.textContent="위치 기능을 지원하지 않아 서울 시청 주변을 검색합니다.";
    currentLocation=map.getCenter();searchNearbyPlaces();return;
  }
  statusText.textContent="브라우저의 위치 권한 요청을 허용해 주세요.";
  navigator.geolocation.getCurrentPosition(function(position){
    currentLocation=new kakao.maps.LatLng(position.coords.latitude,position.coords.longitude);
    map.setCenter(currentLocation);
    if(currentLocationMarker)currentLocationMarker.setMap(null);
    currentLocationMarker=new kakao.maps.Marker({
      map:map,position:currentLocation,image:createSvgMarker("#2468d9","나"),
      title:"현재 위치",zIndex:5
    });
    statusText.textContent="현재 위치 주변 장소를 찾고 있습니다.";
    searchNearbyPlaces();
  },function(error){
    /* 위치 확인 실패 시 기본 지도 중심을 이용 */
    currentLocation=map.getCenter();
    if(error.code===1)statusText.textContent="위치 권한이 거부되어 기본 지도 위치 주변을 검색합니다.";
    else if(error.code===2)statusText.textContent="현재 위치를 확인할 수 없어 기본 지도 위치 주변을 검색합니다.";
    else statusText.textContent="위치 확인 시간이 초과되어 기본 지도 위치 주변을 검색합니다.";
    searchNearbyPlaces();
  },{enableHighAccuracy:false,timeout:10000,maximumAge:60000});
}

/* 장소 마커와 팝업 제거 */
function clearPlaceMarkers(){
  placeMarkers.forEach(marker=>marker.setMap(null));placeMarkers=[];
  if(infoWindow)infoWindow.close();
}
function clearPlaces(){resultList.replaceChildren();clearPlaceMarkers();}
function getPlaceAddress(place){return place.road_address_name||place.address_name||"주소 정보 없음";}

/* 두 좌표 사이의 거리를 미터 단위로 계산 (하버사인 공식) */
function getDistanceMeters(pointA,pointB){
  const earthRadius=6371000;
  const lat1=pointA.getLat()*Math.PI/180;
  const lat2=pointB.getLat()*Math.PI/180;
  const deltaLat=(pointB.getLat()-pointA.getLat())*Math.PI/180;
  const deltaLng=(pointB.getLng()-pointA.getLng())*Math.PI/180;
  const a=Math.sin(deltaLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(deltaLng/2)**2;
  return earthRadius*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

/* 장소 이름과 주소를 팝업으로 표시 */
function showPlaceInfo(place,marker){
  const content=document.createElement("div");content.className="info-window";
  const title=document.createElement("div");title.className="info-title";title.textContent=place.place_name;
  const address=document.createElement("div");address.className="info-address";address.textContent=getPlaceAddress(place);
  content.append(title,address);infoWindow.setContent(content);infoWindow.open(map,marker);
}

/* 검색 결과를 목록과 지도에 표시 */
function displayPlaces(results,category,requestId){
  if(requestId!==searchRequestId)return;
  clearPlaces();
  if(!results||results.length===0){statusText.textContent="주변에서 검색 결과를 찾지 못했습니다.";return;}
  statusText.textContent=(category==="convenience"?"편의점 ":"경찰서 ")+results.length+"곳을 찾았습니다.";
  results.forEach(function(place){
    const item=document.createElement("article");item.className="place-item";item.tabIndex=0;
    const heading=document.createElement("div");heading.className="place-heading";
    const dot=document.createElement("span");dot.className="place-dot "+category;
    dot.textContent=category==="convenience"?"C":"P";dot.setAttribute("aria-hidden","true");
    const details=document.createElement("div");details.style.minWidth="0";
    const name=document.createElement("h2");name.className="place-name";name.textContent=place.place_name;
    const address=document.createElement("p");address.className="place-address";address.textContent=getPlaceAddress(place);
    details.append(name,address);heading.append(dot,details);item.appendChild(heading);
    /* 카카오맵 상세 페이지 링크 */
    if(place.place_url){
      const link=document.createElement("a");link.className="place-link";link.href=place.place_url;
      link.target="_blank";link.rel="noopener noreferrer";link.textContent="카카오맵에서 자세히 보기";
      link.addEventListener("click",event=>event.stopPropagation());item.appendChild(link);
    }
    /* 목록을 선택하면 지도 이동 및 팝업 표시 */
    function selectPlace(){const position=new kakao.maps.LatLng(Number(place.y),Number(place.x));map.panTo(position);showPlaceInfo(place,marker);}
    item.addEventListener("click",selectPlace);
    item.addEventListener("keydown",function(event){if(event.key==="Enter"||event.key===" "){event.preventDefault();selectPlace();}});
    resultList.appendChild(item);
    /* 편의점과 경찰서는 서로 다른 색상의 마커 사용 */
    const marker=new kakao.maps.Marker({
      map:map,position:new kakao.maps.LatLng(Number(place.y),Number(place.x)),
      image:getPlaceMarkerImage(category),title:place.place_name
    });
    /* 마커를 누르면 장소 이름과 주소 팝업 표시 */
    kakao.maps.event.addListener(marker,"click",function(){showPlaceInfo(place,marker);});
    placeMarkers.push(marker);
  });
}

/* 선택된 탭에 따라 주변 장소 검색 */
function searchNearbyPlaces(){
  if(!mapReady||!places||!currentLocation)return;
  const requestId=++searchRequestId;clearPlaces();
  const categoryName=activeCategory==="convenience"?"편의점":"경찰서";
  statusText.textContent="주변 "+categoryName+"을(를) 검색하고 있습니다.";
  if(activeCategory==="convenience"){
    /* 편의점은 카카오 장소 카테고리 코드 CS2로 검색 */
    places.categorySearch("CS2",function(results,status){
      if(requestId!==searchRequestId)return;
      if(status===kakao.maps.services.Status.OK)displayPlaces(results,activeCategory,requestId);
      else if(status===kakao.maps.services.Status.ZERO_RESULT)statusText.textContent="주변에 편의점 검색 결과가 없습니다.";
      else statusText.textContent="편의점 검색에 실패했습니다. 잠시 후 다시 시도해 주세요.";
    },{location:currentLocation,radius:2000,sort:kakao.maps.services.SortBy.DISTANCE,size:15});
  }else{
    /* 경찰서는 키워드로 검색하고 주변 2km 결과만 표시 */
    places.keywordSearch("경찰서",function(results,status){
      if(requestId!==searchRequestId)return;
      if(status===kakao.maps.services.Status.OK){
        const nearbyResults=results.filter(function(place){
          const position=new kakao.maps.LatLng(Number(place.y),Number(place.x));
          const distance=getDistanceMeters(currentLocation,position);
          return distance<=2000;
        });
        displayPlaces(nearbyResults,activeCategory,requestId);
      }else if(status===kakao.maps.services.Status.ZERO_RESULT)statusText.textContent="주변에 경찰서 검색 결과가 없습니다.";
      else statusText.textContent="경찰서 검색에 실패했습니다. 잠시 후 다시 시도해 주세요.";
    },{location:currentLocation,radius:2000,sort:kakao.maps.services.SortBy.DISTANCE,size:15});
  }
}

/* 탭을 누르면 이전 결과를 지우고 새 장소 검색 */
tabButtons.forEach(function(button){
  button.addEventListener("click",function(){
    if(!mapReady)return;
    activeCategory=button.dataset.category;
    tabButtons.forEach(function(tab){
      const isActive=tab===button;tab.classList.toggle("active",isActive);
      tab.setAttribute("aria-selected",String(isActive));
    });
    clearPlaces();searchNearbyPlaces();
  });
});

/* SDK가 준비된 뒤 지도 초기화 */
if(window.kakao&&window.kakao.maps){
  kakao.maps.load(function(){initializeMap();});
}else{
  statusText.textContent="카카오맵 SDK를 불러오지 못했습니다. 인터넷 연결, API 키, 웹 도메인 설정을 확인해 주세요.";
}
</script>
</body>
</html>
